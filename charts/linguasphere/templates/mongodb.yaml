apiVersion: v1
kind: PersistentVolumeClaim
metadata:
 name: mongodb-pvc
 namespace: {{ .Values.namespace }}
 labels:
   app: mongodb
spec:
 accessModes:
   - ReadWriteOnce
 resources:
   requests:
     storage: {{ .Values.mongodb.storage }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: mongodb
 namespace: {{ .Values.namespace }}
 labels:
   app: mongodb
spec:
 replicas: 1
 selector:
   matchLabels:
     app: mongodb
 template:
   metadata:
     labels:
       app: mongodb
   spec:
     containers:
       - name: mongodb
         image: {{ .Values.mongodb.image }}
         imagePullPolicy: IfNotPresent
         ports:
           - containerPort: 27017
         volumeMounts:
           - name: mongodb-data
             mountPath: /data/db
     volumes:
       - name: mongodb-data
         persistentVolumeClaim:
           claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
 name: mongodb
 namespace: {{ .Values.namespace }}
 labels:
   app: mongodb
spec:
 type: ClusterIP
 selector:
   app: mongodb
 ports:
   - name: mongodb
     protocol: TCP
     port: 27017
     targetPort: 27017
