{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 name: linguasphere-ingress
 namespace: {{ .Values.namespace }}
 labels:
   app: linguasphere
spec:
 ingressClassName: {{ .Values.ingress.className }}
 rules:
   - http:
       paths:
         - path: /api
           pathType: Prefix
           backend:
             service:
               name: backend
               port:
                 number: {{ .Values.backend.port }}
         - path: /
           pathType: Prefix
           backend:
             service:
               name: frontend
               port:
                 number: {{ .Values.frontend.servicePort }}
{{- end }}
