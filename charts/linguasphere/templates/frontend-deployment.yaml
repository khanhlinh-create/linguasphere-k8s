apiVersion: apps/v1
kind: Deployment
metadata:
 name: frontend
 namespace: {{ .Values.namespace }}
 labels:
   app: frontend
spec:
 replicas: {{ .Values.frontend.replicas }}
 selector:
   matchLabels:
     app: frontend
 strategy:
   type: RollingUpdate
   rollingUpdate:
     maxUnavailable: 1
     maxSurge: 1
 template:
   metadata:
     labels:
       app: frontend
   spec:
     containers:
       - name: frontend
         image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
         imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
         ports:
           - containerPort: {{ .Values.frontend.port }}
         readinessProbe:
           httpGet:
             path: /
             port: {{ .Values.frontend.port }}
           initialDelaySeconds: 5
           periodSeconds: 10
         livenessProbe:
           httpGet:
             path: /
             port: {{ .Values.frontend.port }}
           initialDelaySeconds: 15
           periodSeconds: 20
