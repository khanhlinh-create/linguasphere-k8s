apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
 name: linguasphere-prod
 namespace: argocd
spec:
 project: default
 source:
   repoURL: https://github.com/khanhlinh-create/linguasphere-k8s.git
   targetRevision: main
   path: charts/linguasphere
   helm:
     valueFiles:
       - values-prod.yaml
 destination:
   server: https://kubernetes.default.svc
   namespace: linguasphere
 syncPolicy:
   automated:
     prune: true
     selfHeal: true
   syncOptions:
     - CreateNamespace=true
